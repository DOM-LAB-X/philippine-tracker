name: Build Windows EXE

on:
  release:
    types: [created]   # auto-runs whenever you publish a GitHub release
  workflow_dispatch:   # lets you trigger manually from the Actions tab

permissions:
  contents: write      # required to upload assets to a release

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate app icon
        run: python assets/create_icon.py

      - name: Build single-file EXE
        run: |
          pyinstaller `
            --name "PhilFlight Tracker" `
            --windowed `
            --onefile `
            --icon "assets\icon.ico" `
            --add-data "assets\icon.ico;assets" `
            --add-data "assets\icon.png;assets" `
            --add-data "config\default_config.json;config" `
            --add-data "data\airports.json;data" `
            --add-data "version.json;." `
            main.py

      # ── Triggered by a release → attach EXE to that release ──────────────
      - name: Upload EXE to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/PhilFlight Tracker.exe"

      # ── Triggered manually → save EXE as a downloadable artifact ─────────
      - name: Upload EXE as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PhilFlight-Tracker-Windows
          path: "dist/PhilFlight Tracker.exe"
          retention-days: 7
